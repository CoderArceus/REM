group = 'host.exp.exponent'
version = '1.12.26'

buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}

android {
  namespace "expo.modules"
  defaultConfig {
    consumerProguardFiles 'proguard-rules.pro'
    versionCode 1
    versionName "1.12.26"
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", newArchEnabled.toString()

    testInstrumentationRunner "expo.modules.TestRunner"
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  packagingOptions {
    def sharedLibraries = [
      "**/libc++_shared.so",
      "**/libfabricjni.so",
      "**/libfbjni.so",
      "**/libfolly_json.so",
      "**/libfolly_runtime.so",
      "**/libglog.so",
      "**/libhermes.so",
      "**/libjscexecutor.so",
      "**/libjsi.so",
      "**/libreactnativejni.so",
      "**/libreact_debug.so",
      "**/libreact_nativemodule_core.so",
      "**/libreanimated.so",
      "**/libreactrenderer.so",
      "**/libyoga.so",
      "**/libjsireact.so"
    ]
    sharedLibraries.each { lib ->
      pickFirst lib
    }
    doNotStrip "**/libc++_shared.so"
    doNotStrip "**/libjscexecutor.so"
    doNotStrip "**/libjsi.so"
    doNotStrip "**/libfbjni.so"
    doNotStrip "**/libfolly_json.so"
    doNotStrip "**/libfolly_runtime.so"
    doNotStrip "**/libglog.so"
    doNotStrip "**/libhermes.so"
    doNotStrip "**/libreactnativejni.so"
    doNotStrip "**/libreactrenderer.so"
    doNotStrip "**/libyoga.so"
    doNotStrip "**/libjsireact.so"
    doNotStrip "**/libreanimated.so"
    doNotStrip "**/libreact_nativemodule_core.so"
    doNotStrip "**/libreact_debug.so"
  }
}

buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}

dependencies { dependencyHandler ->
  implementation "org.jetbrains.kotlin:kotlin-reflect:${project.ext.kotlinVersion()}"
  implementation 'com.facebook.react:react-android'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'androidx.test:core:1.5.0'
  testImplementation "com.google.truth:truth:1.1.2"
  testImplementation 'io.mockk:mockk:1.13.5'

  addExpoModulesDependencies(dependencyHandler, project)
}

task generateExpoModulesPackageListTask {
  def modulesConfig = getModulesConfig()
  def outputPath = getGenerateExpoModulesPackagesListPath()
  if (modulesConfig) {
    outputs.file(file(outputPath))
    inputs.property("modulesConfig", modulesConfig)
  }

  doLast {
    generateExpoModulesPackageList()
  }
}

preBuild.dependsOn "generateExpoModulesPackageListTask"

useCoreDependencies()
