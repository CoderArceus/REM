name: Build Android APK (Local Gradle)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK (Local)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          cmake-version: 3.22.1
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Generate native code (expo prebuild)
        run: npx expo prebuild --platform android --clean
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: ./android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rem-sleep-cycle-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
